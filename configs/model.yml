model:
  channel: 128                             # Number of convolution channels
  channel_multiplier: [1, 1, 2, 2, 4, 4]   # Multipliers on channel for each residual blocks
  n_res_blocks: 2                          # Number of residual blocks per each channel multiplier
  attn_strides: [16]                       # Attention (multiples of 2)
  attn_heads: 1                            # Attention head
  use_affine_time: false                   # The transformed time is split into two equal parts (gamma and beta). These two parts are then used to perform an affine transformation
  dropout: 0.0                             # Dropout probability
  fold: 1                                  # spatial downsampling and upsampling respectively